# name: lushop.api
# id: "1"
# version: "1.0"
# environment: "dev"

server:
  http:
    addr: 0.0.0.0:8001
    timeout: 1s
    rate_limit:  # 限流配置
      enabled: true  # 是否启用限流
      cpu_threshold: 800  # CPU阈值（0-1000），当CPU超过80%时触发限流
      window_seconds: 10  # 滑动窗口大小（秒）
      bucket: 100  # 桶数量
      whitelist:  # 白名单（不限流的端点）
        - "/lushop.lushop.v1.User/Captcha"  # 验证码接口
        - "/lushop.lushop.v1.User/Login"   # 登录接口
        - "/lushop.lushop.v1.User/Register"  # 注册接口
        - "/lushop.lushop.v1.Goods/GetGoodsList"  # 商品列表
        - "/lushop.lushop.v1.Goods/GetGoodsDetail"  # 商品详情
  grpc:
    addr: 0.0.0.0:9001
    timeout: 1s
data:
  database:
    driver: mysql
    source: root:123456@tcp(127.0.0.1:3306)/lushop_user?charset=utf8mb4&parseTime=True&loc=Local
  redis:
    addr: 127.0.0.1:6379
    dial_timeout: 1s
    password: "123456"
    read_timeout: 0.5s
    write_timeout: 0.5s
trace:
  endpoint: http://127.0.0.1:14268/api/traces
auth:
  jwt_key: "lCBOKwLE5w9JHriyihpaKKXiQGnqztgA/lmDYtfExC1BwYDdarpdW0hsVHGf0m9x"
service:
  user:
    endpoint: discovery:///lushop.user.service
  goods:
    endpoint: discovery:///lushop.goods.service
  user_auth:
    endpoint: "discovery:///lushop.userauth.service"  # 新增认证服务
  order:
    endpoint: "discovery:///lushop.order.service"  # 订单服务
  inventory:
    endpoint: "discovery:///lushop.inventory.service"  # 库存服务
  userop:
    endpoint: "discovery:///lushop.userop.service"  # 用户操作服务
