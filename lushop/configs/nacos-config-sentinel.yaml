# name: lushop.api
# id: "1"
# version: "1.0"
# environment: "dev"
# Sentinel 完整配置示例

server:
  http:
    addr: 0.0.0.0:8001
    timeout: 1s
    rate_limit:  # Sentinel 限流配置
      enabled: true  # 是否启用 Sentinel 限流
      whitelist:  # 白名单（不限流的端点）
        - "/lushop.lushop.v1.User/Captcha"  # 验证码接口
        - "/lushop.lushop.v1.User/Login"   # 登录接口
        - "/lushop.lushop.v1.User/Register"  # 注册接口
        - "/lushop.lushop.v1.Goods/GetGoodsList"  # 商品列表
        - "/lushop.lushop.v1.Goods/GetGoodsDetail"  # 商品详情
        - "/metrics"  # Prometheus 监控端点
      # Sentinel 限流规则
      flow_rules:
        # 订单创建接口限流：QPS 1000
        - resource: "/lushop.lushop.v1.Order/CreateOrder"
          threshold: 1000
          stat_interval_ms: 1000
          control_behavior: 0  # 0:Reject（直接拒绝）
        # 购物车接口限流：QPS 2000
        - resource: "/lushop.lushop.v1.Cart/AddCart"
          threshold: 2000
          stat_interval_ms: 1000
          control_behavior: 0
        - resource: "/lushop.lushop.v1.Cart/UpdateCart"
          threshold: 2000
          stat_interval_ms: 1000
          control_behavior: 0
        # 库存接口限流：QPS 500
        - resource: "/lushop.lushop.v1.Inventory/SetInv"
          threshold: 500
          stat_interval_ms: 1000
          control_behavior: 0
        # 用户操作接口限流：QPS 1000
        - resource: "/lushop.lushop.v1.UserOp/CreateAddress"
          threshold: 1000
          stat_interval_ms: 1000
          control_behavior: 0
      # Sentinel 熔断规则（可选）
      cb_rules:
        # 订单服务熔断：慢调用比例超过50%触发熔断
        - resource: "/lushop.lushop.v1.Order/CreateOrder"
          strategy: "SlowRequestRatio"  # 慢调用比例
          retry_timeout_ms: 3000  # 3秒后尝试恢复
          min_request_amount: 10  # 最小请求数
          stat_interval_ms: 10000  # 统计间隔10秒
          max_allowed_rt_ms: 500  # 最大允许响应时间500ms
          threshold: 0.5  # 50%慢请求触发熔断
        # 商品服务熔断：错误率超过30%触发熔断
        - resource: "/lushop.lushop.v1.Goods/*"
          strategy: "ErrorRatio"  # 错误率
          retry_timeout_ms: 5000  # 5秒后尝试恢复
          min_request_amount: 20  # 最小请求数
          stat_interval_ms: 10000  # 统计间隔10秒
          max_allowed_rt_ms: 0  # 错误率策略不需要此字段
          threshold: 0.3  # 30%错误率触发熔断
      # Sentinel 系统规则（可选，全局保护）
      system_rules:
        # CPU使用率超过80%触发限流
        - metric_type: 4  # 4:CpuUsage
          trigger_count: 0.8  # 80%
        # 平均响应时间超过1000ms触发限流
        - metric_type: 1  # 1:AvgRT
          trigger_count: 1000  # 1000ms
  grpc:
    addr: 0.0.0.0:9001
    timeout: 1s
