syntax = "proto3";
package lushop.api;

option go_package = "lushop/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Trace trace = 3; // 链路追踪
  Auth auth = 4; // 认证鉴权
  Service service = 5; // 服务注册与发现
  Nacos nacos = 6;
  Sms sms = 7;
  Task task = 8;
  Authz authz = 9;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
    RateLimit rate_limit = 4; // 限流配置
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message RateLimit {
    bool enabled = 1;              // 是否启用限流
    int32 cpu_threshold = 2;       // CPU阈值（0-1000）
    int32 window_seconds = 3;      // 滑动窗口大小（秒）
    int32 bucket = 4;              // 桶数量
    repeated string whitelist = 5; // 白名单端点（不限流）
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    string password = 3;
    int32 db = 4;
    google.protobuf.Duration dial_timeout = 5;
    google.protobuf.Duration read_timeout = 6;
    google.protobuf.Duration write_timeout = 7;
  }
  Database database = 1;
  Redis redis = 2;
}

message Sms {
  string api_key = 1;
  string api_secret = 2;
  string sign_name = 3;
  string template_code = 4;
  string phone_number = 5;
  string region_id = 6;
}

message Service {
  message User { // 用户服务
    string endpoint = 1;
  }
  message Goods { // 商品服务
    string endpoint = 1;
  }
  message UserAuth { // 用户认证服务
    string endpoint = 1;
  }
  message Order { // 订单服务
    string endpoint = 1;
  }
  message Inventory { // 库存服务
    string endpoint = 1;
  }
  message UserOp { // 用户操作服务
    string endpoint = 1;
  }
  User user = 1;
  Goods goods = 2;
  UserAuth user_auth = 3;
  Order order = 4;
  Inventory inventory = 5;
  UserOp userop = 6;
}

message Trace {
  string endpoint = 1;
}

message Registry {
  message Consul {
    string address = 1;
    string scheme = 2;
  }
  Consul consul = 1;
}

message Auth {
  string jwt_key = 1;
}

message Nacos {
  string addr = 1;
  int32 port = 2;
  string namespace_id = 3;
  string data_id = 4;
  string group_id = 5;
}
message Task {
  repeated TaskItem items = 1;
}

message TaskItem {
  string name = 1;         // 任务名 = Handler.Type()
  string spec = 2;         // cron表达式
  string payload_json = 3; // JSON 载荷
  string queue = 4;        // 可选队列名: critical/default/low
  int32  max_retry = 5;    // 可选重试次数
}

// 后续新增基于gorm数据库的casbin策略
message Authz {
  string adapter = 1;  // "file" | "gorm"
  string model = 2;    // 模型文件路径（file 模式）
  string policy = 3;   // 策略文件路径（file 模式）
  // GORM 相关（gorm 模式）
  string table_name = 4;  // 策略表名，默认 "casbin_rule"
  bool auto_migrate = 5;  // 是否自动建表
}