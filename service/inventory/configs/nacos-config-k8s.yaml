server:
  http:
    addr: 0.0.0.0:8014
    timeout: 1s
  grpc:
    addr: 0.0.0.0:50054
    timeout: 1s

service:
  name: "lushop.inventory.service"

data:
  database:
    driver: mysql
    source: lushop:YourDBPasswordHere@tcp(mysql:3306)/lushop_inventory?charset=utf8mb4&parseTime=True&loc=Local
  redis:
    addr: redis:6379
    password: "YourRedisPasswordHere"
    dial_timeout: 1s
    read_timeout: 0.2s
    write_timeout: 0.2s
  elastic:
    addr: http://elasticsearch:9200

trace:
  endpoint: http://jaeger:14268/api/traces

registry:
  consul:
    address: consul:8500
    scheme: http

rocketmq:
  name_server:
    - "rocketmq:9876"
  group_name: "inventory_consumer_group"
  topic: "order_inventory_topic"
  enable: true
