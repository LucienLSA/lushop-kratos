server:
  http:
    addr: 0.0.0.0:8012
    timeout: 1s
  grpc:
    addr: 0.0.0.0:50052
    timeout: 1s

service:
  name: "lushop.goods.service"

data:
  database:
    driver: mysql
    source: lushop:YourDBPasswordHere@tcp(mysql:3306)/lushop_goods?charset=utf8mb4&parseTime=True&loc=Local
  redis:
    addr: redis:6379
    password: "YourRedisPasswordHere"
    dial_timeout: 1s
    read_timeout: 0.2s
    write_timeout: 0.2s
  elastic:
    addr: http://elasticsearch:9200

trace:
  endpoint: http://jaeger:14268/api/traces

registry:
  consul:
    address: consul:8500
    scheme: http
