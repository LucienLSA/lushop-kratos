global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # API Gateway
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8001']
        labels:
          service: 'api-gateway'

  # Goods Service
  - job_name: 'goods-service'
    static_configs:
      - targets: ['goods-service:8000']
        labels:
          service: 'goods-service'

  # User Service (如果需要监控)
  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8000']
        labels:
          service: 'user-service'

  # UserAuth Service (如果需要监控)
  - job_name: 'userauth-service'
    static_configs:
      - targets: ['userauth-service:8000']
        labels:
          service: 'userauth-service'

  # Inventory Service (如果需要监控)
  - job_name: 'inventory-service'
    static_configs:
      - targets: ['inventory-service:8000']
        labels:
          service: 'inventory-service'

  # Order Service (如果需要监控)
  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:8000']
        labels:
          service: 'order-service'

  # UserOp Service (如果需要监控)
  - job_name: 'userop-service'
    static_configs:
      - targets: ['userop-service:8000']
        labels:
          service: 'userop-service'

  # MySQL Exporter - 监控MySQL性能和慢查询
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']
        labels:
          service: 'mysql'
          instance: 'lushop-mysql'
