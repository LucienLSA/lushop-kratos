global:
  scrape_interval: 15s
 
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'lushop-goods-service'
    static_configs:
      - targets: ['localhost:8012']
  - job_name: 'lushop-inventory-service'
    static_configs:
      - targets: ['localhost:8014']
  - job_name: 'lushop-api-gateway-service'
    static_configs:
      - targets: ['localhost:8001']