apiVersion: v1
kind: ConfigMap
metadata:
  name: lushop-config
  namespace: lushop
data:
  # 数据库配置
  MYSQL_HOST: "mysql-service.lushop.svc.cluster.local"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "lushop"

  # Redis配置
  REDIS_HOST: "redis-service.lushop.svc.cluster.local"
  REDIS_PORT: "6379"

  # Nacos配置
  NACOS_HOST: "nacos-service.lushop.svc.cluster.local"
  NACOS_PORT: "8848"

  # Consul配置
  CONSUL_HOST: "consul-service.lushop.svc.cluster.local"
  CONSUL_PORT: "8500"

  # Elasticsearch配置
  ELASTICSEARCH_HOST: "elasticsearch-service.lushop.svc.cluster.local"
  ELASTICSEARCH_PORT: "9200"

  # RocketMQ配置
  ROCKETMQ_NAMESRV_ADDR: "rocketmq-service.lushop.svc.cluster.local:9876"

  # Jaeger配置
  JAEGER_ENDPOINT: "http://jaeger-service.lushop.svc.cluster.local:14268/api/traces"

  # 应用配置
  APP_ENV: "production"
  LOG_LEVEL: "info"
  HTTP_PORT: "8000"
  GRPC_PORT: "9000"

  # JWT配置
  JWT_SECRET: "your-jwt-secret-key"
  JWT_EXPIRE: "86400"

  # 阿里云OSS配置 (如果使用)
  OSS_ENDPOINT: "oss-cn-shanghai.aliyuncs.com"
  OSS_BUCKET: "lushop-bucket"

  # 短信配置 (如果使用)
  SMS_ACCESS_KEY: "your-sms-access-key"
  SMS_ACCESS_SECRET: "your-sms-access-secret"
  SMS_SIGN_NAME: "lushop"
  SMS_TEMPLATE_CODE: "SMS_123456789"
