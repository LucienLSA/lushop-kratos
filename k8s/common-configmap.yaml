# Lushop 服务基础配置 ConfigMap
# 为所有服务提供 Nacos 连接配置

---
# Gateway ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: lushop
data:
  config.yaml: |
    nacos:
      addr: nacos:8848
      port: 8848
      namespaceId: de9c6a0e-1fbc-425d-8d3b-09066fea6889
      dataId: gateway.yaml
      groupId: lushop_grpc

