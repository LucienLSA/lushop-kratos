apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lushop-ingress
  namespace: lushop
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.lushop.com
    - lushop.yourdomain.com
    secretName: lushop-tls
  rules:
  - host: api.lushop.com
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: lushop-gateway-service
            port:
              number: 8000
      - path: /api/goods
        pathType: Prefix
        backend:
          service:
            name: goods-service
            port:
              number: 8000
      - path: /api/inventory
        pathType: Prefix
        backend:
          service:
            name: inventory-service
            port:
              number: 8000
      - path: /api/order
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 8000
      - path: /api/user
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8000
      - path: /api/userauth
        pathType: Prefix
        backend:
          service:
            name: userauth-service
            port:
              number: 8000
      - path: /api/userop
        pathType: Prefix
        backend:
          service:
            name: userop-service
            port:
              number: 8000
  - host: lushop.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lushop-gateway-service
            port:
              number: 8000
