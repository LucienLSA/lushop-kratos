---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lushop-gateway
  namespace: lushop
  labels:
    app: lushop-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lushop-gateway
  template:
    metadata:
      labels:
        app: lushop-gateway
    spec:
      containers:
      - name: lushop-gateway
        image: crpi-t2nj22cqo7df6n3a.cn-shanghai.personal.cr.aliyuncs.com/aliyun1123466419/lushop:latest
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 9000
          name: grpc
        envFrom:
        - configMapRef:
            name: lushop-config
        - secretRef:
            name: lushop-secret
        env:
        - name: SERVICE_NAME
          value: "lushop-gateway"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
