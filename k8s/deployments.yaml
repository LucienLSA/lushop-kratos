# Lushop 业务服务部署配置
# 包含网关和所有微服务

---
# API Gateway (lushop)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lushop-gateway
  namespace: lushop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lushop-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lushop-gateway
    spec:
      containers:
      - name: gateway
        image: lushop/gateway:latest
        ports:
        - containerPort: 8001
          name: http
        - containerPort: 9001
          name: grpc
        env:
        - name: NACOS_ADDR
          value: "nacos:8848"
        - name: NACOS_NAMESPACE_ID
          value: "de9c6a0e-1fbc-425d-8d3b-09066fea6889"
        - name: NACOS_DATA_ID
          value: "gateway.yaml"
        - name: NACOS_GROUP_ID
          value: "lushop_grpc"
        volumeMounts:
        - name: config-volume
          mountPath: /data/conf
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: config-volume
        configMap:
          name: gateway-config

