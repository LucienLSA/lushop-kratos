apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-namesrv
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rocketmq-namesrv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rocketmq-namesrv
    spec:
      containers:
        - name: namesrv
          image: apache/rocketmq:5.3.3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - mqnamesrv
          ports:
            - containerPort: 9876
              name: namesrv
          readinessProbe:
            tcpSocket:
              port: 9876
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9876
            initialDelaySeconds: 30
            periodSeconds: 10

