apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-dashboard
  namespace: lushop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rocketmq-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rocketmq-dashboard
    spec:
      containers:
      - name: dashboard
        image: apacherocketmq/rocketmq-dashboard:2.0.1
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: TZ
          value: "Asia/Shanghai"
        - name: JAVA_OPTS
          value: >-
            -Drocketmq.config.namesrvAddrs=rocketmq-namesrv:9876
            -Drocketmq.config.accessKey=lushop
            -Drocketmq.config.secretKey=lushop123456
            -Drocketmq.config.loginRequired=true
        volumeMounts:
        - name: dashboard-config
          mountPath: /tmp/rocketmq-console/data
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "200m"
      volumes:
      - name: dashboard-config
        configMap:
          name: rocketmq-dashboard-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rocketmq-dashboard-config
  namespace: lushop
data:
  users.properties: |
    admin=lushop123
---
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-dashboard
  namespace: lushop
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rocketmq-dashboard
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30808
    name: http
