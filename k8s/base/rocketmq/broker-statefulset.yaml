apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rocketmq-broker
spec:
  serviceName: rocketmq-broker
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rocketmq-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rocketmq-broker
    spec:
      containers:
        - name: broker
          image: apache/rocketmq:5.3.3
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESRV_ADDR
              value: rocketmq-namesrv:9876
          command:
            - /bin/sh
            - -c
            - mqbroker -c /etc/rocketmq/broker.conf
          ports:
            - containerPort: 10911
              name: broker-main
            - containerPort: 10912
              name: broker-ha
            - containerPort: 10909
              name: broker-fast
          readinessProbe:
            tcpSocket:
              port: 10911
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 10911
            initialDelaySeconds: 40
            periodSeconds: 10
          volumeMounts:
            - name: rocketmq-config
              mountPath: /etc/rocketmq
            - name: rocketmq-secret
              mountPath: /etc/rocketmq-secret
            - name: store
              mountPath: /home/rocketmq/store
            - name: logs
              mountPath: /home/rocketmq/logs
      volumes:
        - name: rocketmq-config
          configMap:
            name: rocketmq-config
            items:
              - key: broker.conf
                path: broker.conf
        - name: rocketmq-secret
          secret:
            secretName: rocketmq-credentials
            items:
              - key: tools.yml
                path: tools.yml
  volumeClaimTemplates:
    - metadata:
        name: store
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: logs
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

