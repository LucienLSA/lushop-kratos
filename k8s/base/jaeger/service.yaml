apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  ports:
    - name: http-collector
      port: 14268
      targetPort: 14268
    - name: http-query
      port: 16686
      targetPort: 16686
    - name: grpc-collector
      port: 14250
      targetPort: 14250
  selector:
    app.kubernetes.io/name: jaeger

