apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nacos
  namespace: lushop
spec:
  serviceName: nacos
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nacos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nacos
    spec:
      containers:
      - name: nacos
        image: nacos/nacos-server:v2.3.2
        ports:
        - containerPort: 8848
          name: nacos
        - containerPort: 9848
          name: client-rpc
        - containerPort: 9849
          name: raft-rpc
        - containerPort: 7848
          name: old-raft-rpc
        env:
        - name: NACOS_SERVERS
          value: "nacos-0.nacos.lushop.svc.cluster.local:8848"
        - name: MODE
          value: "standalone"
        - name: SPRING_DATASOURCE_PLATFORM
          value: "derby"
        - name: NACOS_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nacos-auth
              key: password
        volumeMounts:
        - name: nacos-config
          mountPath: /home/nacos/conf/application.properties
          subPath: application.properties
        - name: nacos-data
          mountPath: /home/nacos/data
        - name: nacos-logs
          mountPath: /home/nacos/logs
        readinessProbe:
          httpGet:
            path: /nacos/
            port: 8848
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /nacos/
            port: 8848
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: nacos-config
        configMap:
          name: nacos-config
  volumeClaimTemplates:
  - metadata:
      name: nacos-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
      storageClassName: local-path
  - metadata:
      name: nacos-logs
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 2Gi
      storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: nacos-headless
  namespace: lushop
spec:
  selector:
    app.kubernetes.io/name: nacos
  clusterIP: None
  ports:
  - port: 8848
    targetPort: 8848
    name: server
  - port: 9848
    targetPort: 9848
    name: client-rpc
  - port: 9849
    targetPort: 9849
    name: raft-rpc
---
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: lushop
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nacos
  ports:
  - port: 8848
    targetPort: 8848
    nodePort: 30848
    name: nacos
