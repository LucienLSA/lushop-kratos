apiVersion: v1
kind: Service
metadata:
  name: consul
spec:
  ports:
    - name: http
      port: 8500
      targetPort: 8500
    - name: serf-lan
      port: 8301
      targetPort: 8301
    - name: serf-wan
      port: 8302
      targetPort: 8302
    - name: server
      port: 8300
      targetPort: 8300
    - name: dns
      port: 8600
      targetPort: 8600
      protocol: UDP
  selector:
    app.kubernetes.io/name: consul

