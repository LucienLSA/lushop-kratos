apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: NodePort
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      nodePort: 30080
    - name: grpc
      port: 9001
      targetPort: 9001
      nodePort: 30090
  selector:
    app.kubernetes.io/name: gateway-service

