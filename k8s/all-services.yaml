# ==================== UserAuth Service ====================
apiVersion: v1
kind: Service
metadata:
  name: userauth-service
  namespace: lushop
spec:
  type: ClusterIP
  ports:
    - port: 50056
      targetPort: 50056
  selector:
    app: userauth-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userauth-service
  namespace: lushop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: userauth-service
  template:
    metadata:
      labels:
        app: userauth-service
    spec:
      containers:
        - name: userauth-service
          image: lushop/userauth-service:latest
          ports:
            - containerPort: 50056
          envFrom:
            - configMapRef:
                name: lushop-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
