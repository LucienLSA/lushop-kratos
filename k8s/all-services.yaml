# ==================== API Gateway ====================
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: lushop
spec:
  type: LoadBalancer
  ports:
    - port: 8001
      targetPort: 8001
      name: http
    - port: 9001
      targetPort: 9001
      name: grpc
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: lushop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: lushop/api-gateway:latest
          ports:
            - containerPort: 8001
            - containerPort: 9001
          envFrom:
            - configMapRef:
                name: lushop-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
