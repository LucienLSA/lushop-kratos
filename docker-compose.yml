version: '3.8'

services:
  # ==================== 基础设施 ====================
  
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: lushop-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: lushop
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - lushop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: lushop-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456 --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - lushop-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Consul 服务发现
  consul:
    image: consul:latest
    container_name: lushop-consul
    restart: always
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    volumes:
      - consul-data:/consul/data
    networks:
      - lushop-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Jaeger 链路追踪
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: lushop-jaeger
    restart: always
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
    networks:
      - lushop-network

  # RocketMQ NameServer
  rocketmq-namesrv:
    image: apache/rocketmq:4.9.4
    container_name: lushop-rocketmq-namesrv
    restart: always
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Duser.home=/home/rocketmq -Xms512M -Xmx512M -Xmn128M"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    networks:
      - lushop-network

  # RocketMQ Broker
  rocketmq-broker:
    image: apache/rocketmq:4.9.4
    container_name: lushop-rocketmq-broker
    restart: always
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      NAMESRV_ADDR: "rocketmq-namesrv:9876"
      JAVA_OPT_EXT: "-Duser.home=/home/rocketmq -Xms512M -Xmx512M -Xmn128M"
    command: sh mqbroker -c /home/rocketmq/broker.conf
    volumes:
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/broker.conf
    depends_on:
      - rocketmq-namesrv
    networks:
      - lushop-network

  # RocketMQ Console
  rocketmq-console:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: lushop-rocketmq-console
    restart: always
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
    depends_on:
      - rocketmq-namesrv
    networks:
      - lushop-network

  # ==================== 微服务 ====================

  # User Service
  user-service:
    build:
      context: ./service/user
      dockerfile: Dockerfile
    container_name: lushop-user-service
    restart: always
    ports:
      - "50051:50051"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./service/user/configs:/app/configs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - lushop-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 30s
      timeout: 3s
      retries: 3

  # UserAuth Service
  userauth-service:
    build:
      context: ./service/userauth
      dockerfile: Dockerfile
    container_name: lushop-userauth-service
    restart: always
    ports:
      - "50056:50056"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./service/userauth/configs:/app/configs
    depends_on:
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - lushop-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50056"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Goods Service
  goods-service:
    build:
      context: ./service/goods
      dockerfile: Dockerfile
    container_name: lushop-goods-service
    restart: always
    ports:
      - "50052:50052"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./service/goods/configs:/app/configs
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - lushop-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50052"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Inventory Service
  inventory-service:
    build:
      context: ./service/inventory
      dockerfile: Dockerfile
    container_name: lushop-inventory-service
    restart: always
    ports:
      - "50054:50054"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./service/inventory/configs:/app/configs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - lushop-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50054"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Order Service
  order-service:
    build:
      context: ./service/order
      dockerfile: Dockerfile
    container_name: lushop-order-service
    restart: always
    ports:
      - "50053:50053"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./service/order/configs:/app/configs
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    networks:
      - lushop-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50053"]
      interval: 30s
      timeout: 3s
      retries: 3

  # UserOp Service
  userop-service:
    build:
      context: ./service/userop
      dockerfile: Dockerfile
    container_name: lushop-userop-service
    restart: always
    ports:
      - "50055:50055"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./service/userop/configs:/app/configs
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - lushop-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50055"]
      interval: 30s
      timeout: 3s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: ./lushop
      dockerfile: Dockerfile
    container_name: lushop-api-gateway
    restart: always
    ports:
      - "8001:8001"
      - "9001:9001"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./lushop/configs:/data/conf
    depends_on:
      - user-service
      - userauth-service
      - goods-service
      - inventory-service
      - order-service
      - userop-service
    networks:
      - lushop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/metrics"]
      interval: 30s
      timeout: 3s
      retries: 3

# 网络配置
networks:
  lushop-network:
    driver: bridge

# 数据卷
volumes:
  mysql-data:
  redis-data:
  consul-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
